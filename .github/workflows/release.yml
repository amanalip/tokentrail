# Token Trail tag-driven draft-release pipeline.
#
# Purpose: turn an approved version tag into a draft GitHub Release containing the
# four Linux package formats for both supported architectures, with checksums,
# per-architecture provenance, and a software bill of materials. The workflow
# implements implementation-plan section 9.3.
#
# Release safety properties:
# - The trigger is exactly a pushed `v*` tag. Ordinary branch pushes and pull
#   requests can never create or replace a release, whatever their contents do.
# - Every artifact lands on a *draft* prerelease. Publication stays a deliberate
#   maintainer action after review, so nothing becomes publicly stable from this
#   file alone. Repository-side release immutability must be enabled in settings
#   so a published tag cannot be repointed later (operator configuration).
# - Build jobs run under the protected `release` environment; required reviewers
#   configured there gate any release build before it starts.
# - Third-party actions are pinned to reviewed commit SHAs, and release creation
#   uses GitHub's own preinstalled CLI rather than another third-party action.
# - Signatures are intentionally absent: no Linux signing identity has been
#   approved yet, so artifacts ship as unsigned preview builds and say so.

name: Draft release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One distinct build job per architecture keeps provenance unambiguous and lets
  # each architecture be rebuilt independently without relabeling its output.
  build-x64:
    name: Build x64 packages
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 40
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Match the manifest-pinned npm version
        run: npm install --global npm@12.0.2

      # Fail closed before building anything if the tag and manifest disagree;
      # a draft whose version differs from its tag could never be trusted.
      - name: Verify the tag matches the manifest version
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"

      - name: Install dependencies frozen from the lockfile
        run: npm ci

      # rpmbuild comes from Ubuntu's `rpm` package; the other three formats need no
      # extra host tooling beyond what electron-builder bundles.
      - name: Install rpm packaging tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm libarchive-tools

      # The Vite bundles must exist before packaging because electron-builder archives
      # only reviewed runtime files; then --publish never keeps artifact creation
      # strictly local, since electron-builder otherwise attempts implicit GitHub
      # publishing whenever a git tag is present. This pipeline alone decides what
      # reaches a draft release.
      - name: Build production bundles
        run: npm run build

      - name: Build all four package formats for x64
        run: npx electron-builder --linux AppImage deb rpm pacman --x64 --publish never --config electron-builder.config.cjs

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum tokentrail-*.AppImage tokentrail-*.deb tokentrail-*.rpm tokentrail-*.pacman \
            > "SHA256SUMS-x64.txt"

      # Machine-readable provenance records exactly what ran where, so a downloaded
      # artifact can always be traced back to its producing commit and runner.
      - name: Record build provenance
        run: |
          node scripts/write-build-provenance.mjs \
            --arch x64 \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --output release/provenance-x64.json

      - name: Upload x64 release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-x64
          path: |
            release/tokentrail-*
            release/SHA256SUMS-x64.txt
            release/provenance-x64.json
          if-no-files-found: error
          retention-days: 14

  build-arm64:
    name: Build arm64 packages
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 40
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Match the manifest-pinned npm version
        run: npm install --global npm@12.0.2

      - name: Verify the tag matches the manifest version
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"

      - name: Install dependencies frozen from the lockfile
        run: npm ci

      - name: Install rpm packaging tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm libarchive-tools

      # Cross-building arm64 Linux targets on an x64 runner needs no emulation:
      # no native modules are rebuilt, and electron-builder fetches the matching
      # Electron distribution for the requested architecture.
      - name: Build production bundles
        run: npm run build

      - name: Build all four package formats for arm64
        run: npx electron-builder --linux AppImage deb rpm pacman --arm64 --publish never --config electron-builder.config.cjs

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum tokentrail-*.AppImage tokentrail-*.deb tokentrail-*.rpm tokentrail-*.pacman \
            > "SHA256SUMS-arm64.txt"

      - name: Record build provenance
        run: |
          node scripts/write-build-provenance.mjs \
            --arch arm64 \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --output release/provenance-arm64.json

      - name: Upload arm64 release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files-arm64
          path: |
            release/tokentrail-*
            release/SHA256SUMS-arm64.txt
            release/provenance-arm64.json
          if-no-files-found: error
          retention-days: 14

  sbom:
    name: Generate dependency SBOM
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Match the manifest-pinned npm version
        run: npm install --global npm@12.0.2

      - name: Install dependencies frozen from the lockfile
        run: npm ci

      # npm's built-in CycloneDX output covers every locked production and
      # development component without adding another dependency to audit. The
      # release directory is created here because no packaging step runs in
      # this job to create it.
      - name: Emit the CycloneDX SBOM from the lockfile
        run: |
          mkdir -p release
          npm sbom --sbom-format cyclonedx --sbom-type application > release/tokentrail-sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: release/tokentrail-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  # Assemble everything onto one immutable draft. This job holds the only write
  # permission in the pipeline, scoped to creating that single draft release.
  draft-release:
    name: Collect files onto a draft release
    needs: [build-x64, build-arm64, sbom]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all built release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: staging

      - name: Combine per-architecture checksums into one manifest
        run: |
          cat staging/SHA256SUMS-x64.txt staging/SHA256SUMS-arm64.txt > staging/SHA256SUMS.txt
          rm staging/SHA256SUMS-x64.txt staging/SHA256SUMS-arm64.txt

      - name: Write honest draft notes
        run: |
          cat > staging/RELEASE-NOTES.md <<NOTES
          Token Trail ${GITHUB_REF_NAME} — development preview draft.

          Built from commit ${GITHUB_SHA}. All four package formats are provided
          for both x64 and arm64; verify downloads against \`SHA256SUMS.txt\`
          before installing anything.

          These builds are unsigned previews: no Linux signing identity has been
          approved yet, and this draft becomes public only through explicit
          maintainer publication after review.
          NOTES

      - name: Create the draft release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks out no repository — it assembles downloaded artifacts —
          # so the CLI is told which repository to act on instead of asking git.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --prerelease \
            --title "Token Trail ${GITHUB_REF_NAME} (draft)" \
            --notes-file staging/RELEASE-NOTES.md
          # Explicit globs keep the notes template itself off the public asset list.
          gh release upload "${GITHUB_REF_NAME}" \
            staging/tokentrail-* \
            staging/SHA256SUMS.txt \
            staging/provenance-x64.json \
            staging/provenance-arm64.json
