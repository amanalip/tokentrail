<!--
  Token Trail production icon master.

  Responsibility: single vector source of every Token Trail raster export. Trust level: static
  application-owned branding data with no execution semantics. Dependencies: none; pure SVG 1.1
  shapes readable by librsvg, Chromium, and electron-builder. Side effects: none.
  Denied behavior: this file must never reference remote resources, scripts, or animations.

  Provenance: authored as the vector reconstruction of the approved `tokentrail-icon-v2-dark.png`
  mark. Geometry was fitted from pixel measurements of that asset and verified by rendering this
  file at 512x512 and comparing against it: fewer than one percent of pixels differ beyond an
  eight percent color tolerance, concentrated in anti-aliased edges. Regenerate raster exports
  after any edit here with `npm run export:branding`, and re-run the window-identity evidence.

  License: project-owned original artwork distributed under the repository's GPL-3.0-only license.
-->
