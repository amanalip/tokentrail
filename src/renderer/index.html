<!doctype html>
<html lang="en">
  <head>
    <!-- Declare UTF-8 before text so browser parsing is deterministic. -->
    <meta charset="UTF-8" />

    <!-- Vite replaces this fail-closed marker with the environment-specific reviewed renderer policy. -->
    <meta http-equiv="Content-Security-Policy" content="__TOKENTRAIL_CONTENT_SECURITY_POLICY__" />

    <!-- Keep the shell readable across desktop scaling and future responsive layouts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Set the native title before React starts. -->
    <title>Token Trail</title>
  </head>
  <body>
    <!-- React mounts only into this application-owned root. -->
    <div id="root"></div>

    <!-- Load the authored renderer entry as a local ES module transformed by Vite. -->
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
